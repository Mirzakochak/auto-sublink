name: Update Sublinks

on:
  schedule:
    - cron: '0 */6 * * *' # اجرا به صورت خودکار هر ۶ ساعت یک‌بار
  workflow_dispatch: # قابلیت اجرای دستی با دکمه در گیت‌هاب

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sub*.txt
        git commit -m "Auto-update sublinks" || echo "No changes to commit"
        git push
